<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffdf5">
  <title>Profile | Stamp Quest</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="images/stampquest.ico">
</head>

<body>
  <header class="topbar">
    <b class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Profile</span>
    </b>
  </header>

  <main class="page profile-page">
    <section class="card profile">
      <div class="avatar-wrap">
        <button id="avatarButton" class="avatar-button" type="button" aria-label="Change profile photo">
          <div id="avatar" class="avatar">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <img id="avatarImage" class="avatar-image" alt="Your profile photo" hidden>
          <span class="avatar-camera" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
          </span>
        </button>
        <input id="avatarInput" type="file" accept="image/jpeg,image/png,image/webp,image/*" hidden>
      </div>

      <h1 id="name">Loading...</h1>
      <p id="email"></p>

      <div class="stats">
        <div>
          <b id="xp">0</b>
          <small>XP</small>
        </div>
        <div>
          <b id="streak">0</b>
          <small>Day Streak</small>
        </div>
        <div>
          <b id="count">0</b>
          <small>Stamps</small>
        </div>
      </div>
    </section>

    <section class="card upload-profile-card">
      <div class="upload-profile-copy">
        <span class="upload-profile-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        </span>
        <div>
          <h2>Your profile photo</h2>
          <p>Upload a photo from your phone. Saved locally in your browser.</p>
        </div>
      </div>

      <button id="uploadPhoto" class="btn primary full-btn" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
        <span>Upload your photo</span>
      </button>

      <button id="removePhoto" class="text-button" type="button" hidden>
        Remove profile photo
      </button>
    </section>

    <section class="card profile-menu">
      <button class="profile-action" type="button" onclick="location.href='quest.html'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
        <span>How it works</span>
        <span class="arrow">›</span>
      </button>

      <button class="profile-action" type="button" onclick="location.href='collection.html'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 7h10"/><path d="M7 12h10"/><path d="M7 17h6"/></svg>
        <span>View my stamps</span>
        <span class="arrow">›</span>
      </button>
    </section>

    <button id="logout" class="btn secondary" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
      <span>Log out</span>
    </button>
  </main>

  <nav class="bottom" aria-label="Main navigation">
    <a href="quest.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Quest</span>
    </a>
    <a href="collection.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 7h10"/><path d="M7 12h10"/><path d="M7 17h6"/></svg>
      <span>Stamps</span>
    </a>
    <a class="active" href="profile.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Me</span>
    </a>
  </nav>

  <div id="photoMessage" class="toast" role="status" aria-live="polite"></div>

  <script src="js/app.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
