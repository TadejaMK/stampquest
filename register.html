<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Register — Stamp Quest</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="images/stampquest.ico">
</head>
<body>
  <main class="auth">
    <a class="back" href="index.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      <span>Back</span>
    </a>

    <h1>Create account</h1>
    <p>Start collecting your daily stamps.</p>

    <form id="registerForm">
      <input id="username" placeholder="Username" autocomplete="username" required>
      <input id="email" type="email" placeholder="Email" autocomplete="email" required>
      <input id="password" type="password" placeholder="Password" autocomplete="new-password" required>
      <button class="btn" type="submit">
        <span>Create Account</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg>
      </button>
    </form>

    <p id="msg"></p>
    <p>Already registered? <a href="login.html">Login</a></p>
  </main>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
