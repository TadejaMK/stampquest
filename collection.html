<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>My Stamps</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="images/stampquest.ico">
</head>

<body>
  <header class="topbar">
    <b class="brand">
      <svg class="brand-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 8h8v8H8z"/><path d="M3 9h2"/><path d="M3 15h2"/><path d="M19 9h2"/><path d="M19 15h2"/><path d="M9 3v2"/><path d="M15 3v2"/><path d="M9 19v2"/><path d="M15 19v2"/></svg>
      <span>My Stamps</span>
    </b>
  </header>

  <main class="page">
    <div id="stamps" class="stamp-grid"></div>
  </main>

  <nav class="bottom" aria-label="Main navigation">
    <a href="quest.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Quest</span>
    </a>
    <a class="active" href="collection.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 7h10"/><path d="M7 12h10"/><path d="M7 17h6"/></svg>
      <span>Stamps</span>
    </a>
    <a href="profile.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Me</span>
    </a>
  </nav>

  <div id="stampDetailModal" class="modal" hidden>
    <div class="modal-box">
      <button id="closeDetail" class="close" type="button" aria-label="Close details">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>

      <h2 id="detailTitle">Stamp Details</h2>

      <img id="detailImage" class="detail-stamp" alt="Stamp detail">

      <p class="detail-description" id="detailDescription"></p>

      <p>
        <b>Date:</b>
        <span id="detailDate"></span>
      </p>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/collection.js"></script>
</body>
</html>
